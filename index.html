tle>Math App sans Backend</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.29.1/plotly.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" />
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { font-size: 16px; margin: 5px; }
    .output { background: #eee; padding: 10px; margin-top: 10px; border-radius: 5px; }
    #graph { width: 100%; height: 400px; }
  </style>
</head>
<body>
  <h1>🧠 Calculatrice MathJS (GitHub Pages)</h1>

  <h3>🧮 Calculer une expression</h3>
  <input type="text" id="expr" placeholder="ex: derivative(x^2, x)" size="40">
  <button onclick="calculer()">Calculer</button>
  <div id="result" class="output"></div>

  <h3>📊 Tracer une fonction</h3>
  <input type="text" id="fonction" placeholder="ex: sin(x)" size="30">
  <button onclick="tracer()">Tracer</button>
  <div id="graph"></div>

  <h3>🖋️ Affichage LaTeX</h3>
  <input type="text" id="latex" placeholder="ex: \\int x^2 dx" size="40">
  <div id="katex-output" class="output"></div>

  <script>
    function calculer() {
      const expr = document.getElementById("expr").value;
      try {
        const result = math.evaluate(expr);
        document.getElementById("result").innerText = result;
      } catch (err) {
        document.getElementById("result").innerText = "Erreur : " + err.message;
      }
    }

    function tracer() {
      const expr = document.getElementById("fonction").value;
      const x = math.range(-10, 10, 0.1).toArray();
      let y;
      try {
        y = x.map(val => math.evaluate(expr, { x: val }));
        Plotly.newPlot("graph", [{ x, y, type: "scatter" }], { title: `f(x) = ${expr}` });
      } catch (e) {
        alert("Erreur dans l'expression");
      }
    }

    document.getElementById("latex").addEventListener("input", () => {
      const tex = document.getElementById("latex").value;
      try {
        katex.render(tex, document.getElementById("katex-output"), { throwOnError: false });
      } catch (err) {
        document.getElementById("katex-output").innerText = "Erreur LaTeX";
      }
    });
  </script>
</body>
</html>
