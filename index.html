<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathAI Ultimate - Solution Complète</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mathlive@0.73.9/dist/mathlive.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.11.1/min/plotly.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/10.6.4/math.min.js"></script>
    <style>
        /* Styles optimisés */
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .tabcontent { display: none; padding: 20px; border: 1px solid #ddd; margin-top: 10px; }
        .active { display: block; }
        button { padding: 10px; margin: 5px; background: #4285f4; color: white; border: none; cursor: pointer; }
        #graph2D, #graph3D { width: 100%; height: 400px; border: 1px solid #ddd; }
        #handwritingCanvas { border: 1px solid #000; margin: 10px 0; width: 100%; height: 200px; }
        input, .math-field { padding: 8px; margin: 5px; width: 200px; }
    </style>
</head>
<body>

<h1>MathAI Ultimate</h1>

<!-- Onglets -->
<div>
    <button onclick="openTab('Calcul')">Calcul</button>
    <button onclick="openTab('Equations')">Équations</button>
    <button onclick="openTab('Graphiques')">Graphiques</button>
    <button onclick="openTab('Reconnaissance')">Reconnaissance</button>
</div>

<!-- Calcul Formel -->
<div id="Calcul" class="tabcontent active">
    <h2>Calcul Formel</h2>
    <div id="mathEditor" class="math-field"></div>
    <button onclick="calculate()">Calculer</button>
    <button onclick="derive()">Dériver</button>
    <button onclick="integrate()">Intégrer</button>
    <div id="calcResult" class="result"></div>
</div>

<!-- Solveur d'équations -->
<div id="Equations" class="tabcontent">
    <h2>Solveur d'Équations</h2>
    <div>
        <input type="number" id="a" placeholder="a">x² + 
        <input type="number" id="b" placeholder="b">x + 
        <input type="number" id="c" placeholder="c"> = 0
    </div>
    <button onclick="solveQuadratic()">Résoudre</button>
    <div id="eqResult" class="result"></div>
</div>

<!-- Graphiques -->
<div id="Graphiques" class="tabcontent">
    <h2>Graphiques</h2>
    <input type="text" id="function2D" value="sin(x)" placeholder="Fonction 2D">
    <button onclick="plot2D()">Tracer 2D</button>
    <div id="graph2D"></div>
    
    <input type="text" id="function3D" value="sin(x)+cos(y)" placeholder="Fonction 3D">
    <button onclick="plot3D()">Tracer 3D</button>
    <div id="graph3D"></div>
</div>

<!-- Reconnaissance manuscrite -->
<div id="Reconnaissance" class="tabcontent">
    <h2>Reconnaissance</h2>
    <canvas id="handwritingCanvas"></canvas>
    <button onclick="clearCanvas()">Effacer</button>
    <button onclick="recognize()">Reconnaître</button>
    <div id="recognitionResult" class="result"></div>
</div>

<script>
// Initialisation
const mathField = MathLive.makeMathField('mathEditor', {
    virtualKeyboardMode: 'manual'
});

// Gestion des onglets
function openTab(tabName) {
    document.querySelectorAll('.tabcontent').forEach(tab => {
        tab.classList.remove('active');
    });
    document.getElementById(tabName).classList.add('active');
}

// Calcul formel
function calculate() {
    try {
        const expr = mathField.getValue();
        const result = math.evaluate(expr);
        document.getElementById('calcResult').innerHTML = `$$${expr} = ${result}$$`;
        MathJax.typeset();
    } catch (e) {
        alert("Erreur: " + e.message);
    }
}

function derive() {
    try {
        const expr = mathField.getValue();
        const result = math.derivative(expr, 'x').toString();
        document.getElementById('calcResult').innerHTML = `$$\\frac{d}{dx}(${expr}) = ${result}$$`;
        MathJax.typeset();
    } catch (e) {
        alert("Erreur: " + e.message);
    }
}

function integrate() {
    try {
        const expr = mathField.getValue();
        const result = math.integrate(expr, 'x').toString();
        document.getElementById('calcResult').innerHTML = `$$\\int ${expr}\\,dx = ${result} + C$$`;
        MathJax.typeset();
    } catch (e) {
        alert("Erreur: " + e.message);
    }
}

// Solveur d'équations
function solveQuadratic() {
    const a = parseFloat(document.getElementById('a').value) || 0;
    const b = parseFloat(document.getElementById('b').value) || 0;
    const c = parseFloat(document.getElementById('c').value) || 0;
    
    let solution;
    
    if (a === 0) {
        solution = b === 0 ? "Pas de solution" : `x = ${(-c/b).toFixed(2)}`;
    } else {
        const delta = b*b - 4*a*c;
        if (delta < 0) {
            const real = (-b/(2*a)).toFixed(2);
            const imag = (Math.sqrt(-delta)/(2*a)).toFixed(2);
            solution = `x = ${real} ± ${imag}i`;
        } else {
            const x1 = ((-b - Math.sqrt(delta))/(2*a));
            const x2 = ((-b + Math.sqrt(delta))/(2*a));
            solution = `x₁ = ${x1.toFixed(2)}, x₂ = ${x2.toFixed(2)}`;
        }
    }
    
    document.getElementById('eqResult').textContent = solution;
}

// Graphiques
function plot2D() {
    try {
        const func = document.getElementById('function2D').value;
        const xValues = [], yValues = [];
        for (let x = -10; x <= 10; x += 0.1) {
            xValues.push(x);
            yValues.push(math.evaluate(func, {x: x}));
        }
        Plotly.newPlot('graph2D', [{
            x: xValues,
            y: yValues,
            type: 'scatter',
            mode: 'lines'
        }]);
    } catch (e) {
        alert("Erreur: " + e.message);
    }
}

function plot3D() {
    try {
        const func = document.getElementById('function3D').value;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(400, 400);
        document.getElementById('graph3D').innerHTML = '';
        document.getElementById('graph3D').appendChild(renderer.domElement);
        
        // Exemple de surface 3D
        const geometry = new THREE.BufferGeometry();
        const material = new THREE.MeshBasicMaterial({color: 0x00ff00, wireframe: true});
        const mesh = new THREE.Mesh(geometry, material);
        scene.add(mesh);
        
        // Génération des points
        const vertices = [];
        for (let x = -5; x <= 5; x += 0.5) {
            for (let y = -5; y <= 5; y += 0.5) {
                const z = math.evaluate(func, {x: x, y: y});
                vertices.push(x, y, z);
            }
        }
        geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
        
        camera.position.z = 10;
        
        function animate() {
            requestAnimationFrame(animate);
            mesh.rotation.x += 0.01;
            mesh.rotation.y += 0.01;
            renderer.render(scene, camera);
        }
        animate();
    } catch (e) {
        alert("Erreur: " + e.message);
    }
}

// Reconnaissance manuscrite
const canvas = document.getElementById('handwritingCanvas');
const ctx = canvas.getContext('2d');
let isDrawing = false;

function initCanvas() {
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#000000';
}

canvas.addEventListener('mousedown', (e) => {
    isDrawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
});

canvas.addEventListener('mousemove', (e) => {
    if (!isDrawing) return;
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
});

canvas.addEventListener('mouseup', () => isDrawing = false);

function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function recognize() {
    // Simulation de reconnaissance
    document.getElementById('recognitionResult').textContent = "Reconnu: x² + 2x + 1";
    mathField.setValue('x^2 + 2x + 1');
    openTab('Calcul');
}

// Initialisation au chargement
window.onload = function() {
    initCanvas();
    mathField.setValue('x^2 + 2x + 1');
    document.getElementById('a').value = 1;
    document.getElementById('b').value = -3;
    document.getElementById('c').value = 2;
    setTimeout(plot2D, 500);
};
</script>
</body>
</html>
