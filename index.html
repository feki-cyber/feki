<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Application Mathématique</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.11.0/math.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist@2.29.1/plotly.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" />
  <script src="https://unpkg.com/mathlive/dist/mathlive.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    #graph { width: 100%; height: 400px; }
    .section { margin-bottom: 30px; }
    .output { background: #f0f0f0; padding: 10px; border-radius: 6px; margin-top: 10px; }
    .editor { width: 100%; height: 40px; border: 1px solid #ccc; font-size: 18px; }
  </style>
</head>
<body>
  <h1>🧠 Application Mathématique Web</h1>

  <div class="section">
    <h2>📝 Éditeur WYSIWYG (MathLive)</h2>
    <math-field id="editor" class="editor">f(x)=x^2</math-field>
    <button onclick="afficherLatex()">Afficher LaTeX</button>
    <div id="latex-output" class="output"></div>
  </div>

  <div class="section">
    <h2>🧮 Calculatrice / Résolution</h2>
    <input type="text" id="input-calc" placeholder="ex: derivative(x^3, x) ou integrate(sin(x), x)" size="50">
    <button onclick="evaluer()">Calculer</button>
    <div id="resultat" class="output"></div>
  </div>

  <div class="section">
    <h2>📊 Graphique (Plotly)</h2>
    <input type="text" id="graph-fn" placeholder="ex: x^2" />
    <button onclick="tracer()">Tracer</button>
    <div id="graph"></div>
  </div>

  <script>
    function afficherLatex() {
      const latex = document.getElementById("editor").value;
      katex.render(latex, document.getElementById("latex-output"), { throwOnError: false });
    }

    function evaluer() {
      try {
        const expr = document.getElementById("input-calc").value;
        const result = math.evaluate(expr);
        document.getElementById("resultat").innerText = result.toString();
      } catch (e) {
        document.getElementById("resultat").innerText = "Erreur : " + e.message;
      }
    }

    function tracer() {
      const fn = document.getElementById("graph-fn").value;
      const x = math.range(-10, 10, 0.1).toArray();
      let y;
      try {
        y = x.map(val => math.evaluate(fn, { x: val }));
      } catch (e) {
        alert("Erreur dans la fonction : " + e.message);
        return;
      }
      Plotly.newPlot('graph', [{ x, y, type: 'scatter' }], { title: `Graphique de ${fn}` });
    }
  </script>
</body>
</html>
